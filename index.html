<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Play PawBorough in your browser.">
  <title>Play PawBorough</title>
  <style>
    :root {
      color-scheme: light;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      background: #f4f7fb;
      color: #172033;
    }

    header {
      padding: 1rem 1.5rem;
      background: #172033;
      color: #fff;
      text-align: center;
    }

    h1 {
      margin: 0;
      font-size: clamp(1.25rem, 3vw, 2rem);
    }

    main {
      width: min(1200px, 100%);
      margin: 0 auto;
      padding: 1rem;
    }

    .game-frame {
      display: block;
      width: 100%;
      height: min(75vh, 800px);
      min-height: 480px;
      border: 0;
      border-radius: 0.75rem;
      background: #fff;
      box-shadow: 0 0.5rem 2rem rgb(23 32 51 / 15%);
    }
  </style>
</head>
<body>
  <header>
    <h1>Play PawBorough</h1>
  </header>

  <main>
    <iframe
      class="game-frame"
      src="https://pawborough.net/"
      sandbox="allow-scripts"
      title="PawBorough game"
      loading="lazy"
      allowfullscreen>
    </iframe>
  </main>
</body>
</html>
